# NGC 6503, 25 Oct 2026, north balcony, full Moon. ASI290MC on 150/750, 30 s gain 100 offset 0.
# Lights: 258 frames in light/, NGC_6503_Light_001-258 in time order (renamed 30 Oct, ../rename_map_2026-10-30.txt):
# 001-200 were saved by Ekos as NGC_5866_Light_173-372 (the first result started at 177), 201-258 as NGC_6503 001-058.
# Flats + dark-flats taken 26 Oct with the camera untouched (laptop screen + T-shirt, Ekos ADU 30000 -> 0.67 s).
NAME=ngc6503
D=/media/vsulym/Transcend/Astrophoto/deepsky/2026/ngc6503/2026-10-25
LIGHTS=$D/light
DARKS=/media/vsulym/Transcend/Astrophoto/deepsky/2026/ngc5866/dark
FLATS=/media/vsulym/Transcend/Astrophoto/deepsky/2026/ngc6503/2026-10-26_flats/flat
DARKFLATS=/media/vsulym/Transcend/Astrophoto/deepsky/2026/ngc6503/2026-10-26_flats/darkflat
WORK=$D/work

# galaxy: centre, size (arcmin) and position angle (deg) from the catalogue
RA=17:49:26.4
DEC=+70:08:40
MAJOR=7.1
MINOR=2.4
PA=123

DECONV=1

# fallback when the online plate solver is down (it was, 26-28 Oct): an earlier solved image of this field
WCS_FROM=$D/result_ngc6503_linear_cc.fits
