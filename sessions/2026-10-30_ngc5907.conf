# NGC 5907 (Splinter Galaxy), 30 Oct 2026 20:15-21:04 UTC. ASI290MC on 150/750, HEQ5 + PHD2 (guide scope 200 mm).
# 94 x 30 s, gain 100, offset 30, 18-20 C. Ekos named the sequence NGC_5906 (frames light/NGC_5906_Light_*).
# Poor conditions: galaxy at 20 deg altitude (airmass 2.9), low in the north, Moon 72 % lit; stars ~8-10".
# Thin cloud from 20:50 UTC (stars dimmed 2-4x, frames 79-80 starless): those frames fail to register.
# Guiding ~1.0" RMS after settling, no dithering; PHD2 calibration had a 13.5 deg orthogonality error.
#
# Darks: none at 30 s that night (only 14 x 10 s, kept in dark_10s/). The 24 Oct NGC 6543 darks are used:
#   30 x 30 s, gain 100, 17.6-19.3 C, but offset 0 (a constant ~300 ADU that the gradient removal takes out).
# Flats: none that night. The 26 Oct master flat fits the camera angle (86.0 deg vs 85.9 on 25 Oct), but its dust rings
#   (~300 px, 1-2 % deep) are no longer in the 30 Oct frames: they were real on 25 Oct (same rings, same places, in the
#   NGC 6503 stack without flat: match +0.56 vs chance 0.32), on 30 Oct the stack without flat shows +0.19 (chance).
#   The dust moved or fell off between 26 and 30 Oct. Used as is, the flat printed the rings as bright rings (-0.46).
#   So it is smoothed per Bayer channel (gaussian sigma 40 px, master_flat_26oct_smooth40.fits): vignetting corrected,
#   no rings. With a flat 73 frames register (65 without). Grid background on top for what the flat leaves.
# No deconvolution: only 2-3 measurable stars, ~10" wide. Black point 6 (4 clipped ~3300 noise grains to black).
# Light noise reduction. Star colours checked against Gaia: correct (field stars are Sun-like, BP-RP 0.8-1.2); more
#   saturation (--sat) only shows the blue/orange fringes from atmospheric dispersion at 20 deg.
NAME=ngc5907
D=/media/vsulym/Transcend/Astrophoto/deepsky/2026/ngc5907
LIGHTS=$D/light
DARKS=/media/vsulym/Transcend/Astrophoto/deepsky/2026/ngc6543/dark
WORK=$D/work
MASTER_FLAT=$D/master_flat_26oct_smooth40

# edge-on spiral (NED / RC3)
RA=15:15:53.7
DEC=+56:19:44
MAJOR=12.8
MINOR=1.4
PA=155

SOLVE=offline                 # VizieR timed out on 26-31 Oct
DECONV=0
DENOISE_MOD=0.4
STRETCH_OPTS="--lumsmooth=0 --black=6 --sky=0.13 --bg=grid --skydn=0.5 --skychroma=1.5 --chroma=1.5 --skyflat=0.15"

# ---- variants tried on 31 Oct (results kept next to work/). To rebuild one, use its lines instead of the ones above.
# (26 Oct flat as is: over-corrects, bright rings, also with an offset-matched dark; results deleted 31 Oct.)
# work_noflat/       no flat (65 frames), with deconvolution in its _final_ files, nr_full/nr_light/nr_none stretches:
#   WORK=$D/work_noflat   (and no MASTER_FLAT line)
# work_dust50/        smoothed flat + half of the 26 Oct dust rings (master_flat_26oct_dust50): slight over-correction
#   WORK=$D/work_dust50   MASTER_FLAT=$D/master_flat_26oct_dust50
# work_ofs_dust25/    best: offset-matched dark + a quarter of the dust rings. The 24 Oct darks have offset 0, the
#   lights offset 30; master_dark_24oct_offset30 = 24 Oct master dark + the 30 Oct offset-30 level per Bayer channel
#   (from dark_10s/: R +441, G +425, B +806; the camera's WB_B=95 scales blue x1.9 even in raw). 71 frames.
#   WORK=$D/work_ofs_dust25   MASTER_DARK=$D/master_dark_24oct_offset30   MASTER_FLAT=$D/master_flat_26oct_dust25
#   (and no DARKS line)
# Deleted 31 Oct: flat as is (over-corrects), offset-matched dark + smoothed flat, constant + hot-pixel map instead
# of darks (blue blotches).
# Noise reduction:  full = DENOISE_MOD=0.7, --skydn=1.0 --skychroma=3 (and --chroma at its default 2.5)
#                   none = stretch ngc5907_linear.fits with --skydn=0 --skychroma=0 --chroma=0
# Black point:      --black=4 (pipeline default) / 6 (used) / 8 (grey sky)
# Saturation:       --sat=1.35 (default, used) / 1.8 / 2.3
