# M81, 2 Sep 2026 21:56-23:19 (camera clock). Canon EOS 550D on a Celestron EdgeHD 8" with the 0.7x reducer
# (1422 mm, f/7), 29 x 60 s ISO 800 (light/*.CR2), darks 15 x 60 s (dark/*.CR2). No flats, no dithering.
# Stacked here from the CR2 files with the darks (work/). The earlier result in work_dslr/ came from m81.FTS, a
# stack made elsewhere (DeepSkyStacker?, 8 Sep; m81.FTS.fits / m81e.FTS.fits are that stack cropped / stretched):
# it showed walking noise (streaks along the drift) and reached 23.9 mag/arcsec2 (1 sigma, 10" boxes).
# Sky 16.6 mag/arcsec2 (G, +-0.5): M81 at 30 deg low in the north, Moon 66 % lit, 73 deg away.
# This stack (26 of 29 frames, darks): walking-noise streaks 2.1x the noise instead of 3.3x, same depth (24.0
# mag/arcsec2, 1 sigma, 10" boxes): sky and 26 min of exposure limit the outer arms. A brighter stretch: TAG=bright,
# --sky=0.24 (work/final/m81_bright_field.png).
NAME=m81
D=/media/vsulym/Transcend/Astrophoto/deepsky/2026/m81/2026-09-02_550d
LIGHTS=$D/light
DARKS=$D/dark
WORK=$D/work

# NED / RC3
RA=09:55:33.2
DEC=+69:03:55
MAJOR=26.9
MINOR=14.1
PA=157

FOCAL=1422
PIXEL=4.3
CROP="875 423 3600 2400"      # 37x25 arcmin around M81: drops the stacking edges and the darkest (vignetted) corners
DECONV=0                      # no deconvolution for now
SOLVE=offline                 # VizieR timed out on 30 Oct
# No flats and strong vignetting. Siril's subsky and the radial model (BG=radial) both left a dark ring around the
# galaxy: the sky under M81 cannot be measured. BG=none: no gradient removal, vignetting left in.
BG=none
# M81 fills most of the field: smaller galaxy mask, or no sky is left for the background and white balance
STRETCH_OPTS="--lumsmooth=0 --black=4 --sky=0.18 --bg=flat --skydn=1.0 --skychroma=3 --skyflat=0.15 --galmask=1.0,1.3"
