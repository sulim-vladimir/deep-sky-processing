# M81, 2 Sep 2026 21:56-23:19 (camera clock). Canon EOS 550D on a Celestron EdgeHD 8" with the 0.7x reducer
# (1422 mm, f/7), 29 x 60 s ISO 800 (light/*.CR2), darks 15 x 60 s (dark/*.CR2). No flats.
# m81.FTS: those lights stacked elsewhere (DeepSkyStacker?), 5202 x 3464, linear, 1740 s.
# m81.FTS.fits: m81.FTS cropped + background + SCNR in Siril (linear); m81e.FTS.fits: the same, stretched (GHS).
# This session starts from m81.FTS at step 3: cp $D/m81.FTS $WORK/m81_stack.fits, then
#   ./process.sh sessions/2026-09-02_m81.conf 3
# Plate solve: 0.613"/px, field 45' x 30' (1447 mm effective with the 550D's 4.3 um pixels).
# Spacing: the T-adapter's extension was left in (camera ~133 mm behind the reducer instead of 105 mm). Stars are
# round in the middle (roundness 0.95) but stretched along the radius towards the corners (0.80; 80 % of corner stars),
# as the reducer manual predicts for too long a spacing; it may also add to the vignetting.
NAME=m81
D=/media/vsulym/Transcend/Astrophoto/deepsky/2026/m81/2026-09-02_550d
LIGHTS=$D                     # unused (no step 1-2)
WORK=$D/work_dslr

# NED / RC3
RA=09:55:33.2
DEC=+69:03:55
MAJOR=26.9
MINOR=14.1
PA=157

FOCAL=1422
PIXEL=4.3
CROP="468 341 4425 2944"      # the same cut as m81e (stacking edges)
DECONV=0                      # no deconvolution for now
SOLVE=offline                 # VizieR timed out on 30 Oct
# No flats and strong vignetting. Siril's subsky and the radial model (BG=radial) both left a dark ring around the
# galaxy: the sky under M81 cannot be measured. BG=none: no gradient removal, vignetting left in.
BG=none
# M81 fills most of the field: smaller galaxy mask, or no sky is left for the background and white balance
STRETCH_OPTS="--lumsmooth=0 --black=4 --sky=0.13 --bg=flat --skydn=1.0 --skychroma=3 --skyflat=0.15 --galmask=1.0,1.3"
