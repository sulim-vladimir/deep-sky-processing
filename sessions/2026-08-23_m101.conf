# M101 (Pinwheel Galaxy), 23/24 Aug 2026 22:08-00:13 UTC. ASI290MC on 150/750, 60 s gain 50 offset 1, 23.5-25.5 C.
# 81 lights (Ekos M_101_Light_002-082), altitude 23.6 -> 16.5 deg, low in the north-west. The mount's reported
# pointing moved ~14' east over the run.
# Darks: 30 x 60 s, same settings, 23.7 C, same night. No flats.
# M101 (24' across) is larger than the field (25.7' x 14.6'): there is almost no empty sky for the background.
TITLE="M101, галактика Вертушка"
ABOUT="Велика спіральна галактика у Великій Ведмедиці, видна майже з площини, приблизно за 21 мільйон світлових років від нас. Знято дуже низько над обрієм (24° → 16°) наприкінці серпня."
NAME=m101
D=/media/vsulym/Transcend/Astrophoto/deepsky/2026/m101/2026-08-23
LIGHTS=$D/light
DARKS=$D/dark
WORK=$D/work

# NGC 5457 (position NED, size HyperLEDA: D25 24.0', nearly round; PA RC3)
RA=14:03:12.5
DEC=+54:20:56
MAJOR=24.0
MINOR=22.9
PA=39

SOLVE=offline                 # VizieR timing out on 31 Oct
# Background: the corners (outside the galaxy) agree within 0.5 sigma, so the gradient is small. A radial vignetting
# model would take M101's round, centred disk for vignetting, and the 26 Oct flat does not fit (camera rotated 74 deg
# since: -160 deg in May/Aug, -86 deg in Oct; that flat is also lopsided). So no model: one sky level per channel,
# measured outside 0.55 x the galaxy's size (--galmask; the usual 1.9 x would leave no sky at all).
BG=none
STRETCH_OPTS="--lumsmooth=0 --black=4 --sky=0.13 --bg=flat --skydn=0.5 --skychroma=1.5 --chroma=1.5 --skyflat=0.15 --galmask=0.55,0.55"
