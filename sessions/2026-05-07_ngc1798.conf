# NGC 1798, 7 May 2026 19:37-20:09 UTC: an old open star cluster in Auriga (NED *Cl), not a galaxy.
# ASI290MC on 150/750, gain 0 offset 1, 28-29 C, altitude 23 -> 19 deg in evening twilight.
# The mount's reported pointing moved 7' in Dec during the run (+47 45.6' -> +47 52.3'); the cluster is 4-10' south of it.
# 24 x 60 s + 2 x 300 s (frames 25-26, left out: no 300 s darks). Darks: 12 x 60 s, 28.2 C, same night. No flats.
# The pipeline treats the cluster as a round 5' "galaxy": kept out of the background models and the white-balance stars.
TITLE="NGC 1798, розсіяне скупчення у Візничому"
ABOUT="Багате старе розсіяне зоряне скупчення (близько 1,5 мільярда років) на околиці Чумацького Шляху, приблизно за 14 000 світлових років від нас. Знято низько над обрієм у вечірніх сутінках."
NAME=ngc1798
D=/media/vsulym/Transcend/Astrophoto/deepsky/2026/ngc1798
LIGHTS=$D/light
DARKS=$D/dark
WORK=$D/work

# cluster centre (NED), ~5' across
RA=05:11:39.3
DEC=+47:41:44
MAJOR=5.0
MINOR=5.0
PA=0

SOLVE=offline                 # VizieR timing out on 31 Oct
BG=radial
BG_RESIDUAL=160
STRETCH_OPTS="--lumsmooth=0 --black=4 --sky=0.13 --bg=flat --skydn=0.5 --skychroma=1.5 --chroma=1.5 --skyflat=0.15"
# frames 25-26 are 300 s (the rest and the darks 60 s): left out
LIGHTS_SKIP="25-26"
