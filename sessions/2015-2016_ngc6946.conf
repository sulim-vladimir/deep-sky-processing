# NGC 6946, three DSLR nights combined. Canon EOS 550D on the 150/750 reflector (1.18"/px, plate solved), no flats.
#   20 Sep 2015: 31 x 29 s ISO 3200   (deepsky/other/ngc6946_fireworks)
#   17-18 Oct 2015: 24 x 180 s ISO 800 + 1 x 105 s ISO 800 + 1 x 60 s ISO 1600   (deepsky/other/ngc6946-2)
#   7-8 Feb 2016: 43 x 90 s + 1 x 36 s ISO 1600, darks 5 x 56-94 s ISO 1600   (deepsky/other/ngc6946-1)
#   101 frames, 2.6 h. The Oct and Feb frames are rotated 180 deg to each other (plate solve: -10 / 169 deg).
# Calibration: darks exist only for Feb and do not match the other exposures, so the Canon black level (2048 ADU) is
# subtracted from every frame and the Feb darks only map hot/cold pixels (HOT_DARK). Frames of different exposure and
# ISO are matched by the stack's additive+scale normalisation and weighted by FWHM.
# LIGHTS is a local folder of links to the three sets (names prefixed by set), built by the commands below.
#   mkdir -p ~/astro-work/ngc6946/lights && cd ~/astro-work/ngc6946/lights
#   for s in ngc6946_fireworks ngc6946-2 ngc6946-1; do for f in $O/$s/*.CR2; do ln -sf "$f" "${s}__$(basename $f)"; done; done
TITLE="NGC 6946, галактика Феєрверк"
ABOUT="Спіральна галактика, яку ми бачимо майже з полюса, на межі Цефея і Лебедя, приблизно за 25 мільйонів світлових років. Названа «Феєрверком» через рекордну кількість спалахів наднових. Три ночі 2015–2016 років разом, 2,6 години експозиції."
TELESCOPE="Рефлектор Sky-Watcher 150/750"
CAMERA="Canon EOS 550D"
NAME=ngc6946
O=/media/vsulym/Transcend/Astrophoto/deepsky/other
LIGHTS=$HOME/astro-work/ngc6946/lights
WORK=$O/ngc6946_2015-2016/work
LIGHT_BIAS=2048
HOT_DARK=$WORK/masters/master_dark_feb2016

# nearly face-on spiral (NED / RC3)
RA=20:34:52.3
DEC=+60:09:14
MAJOR=11.5
MINOR=9.8
PA=52

FOCAL=750
PIXEL=4.3
CROP="0 0 5184 3456"          # set after the stack (step 2)
SOLVE=offline
STRETCH_OPTS="--lumsmooth=0 --black=4 --sky=0.13 --bg=grid --skydn=0.5 --skychroma=1.5 --chroma=1.5 --skyflat=0.15"
