# NGC 2340 group (Lynx), 7 May 2026 20:51-21:18 UTC. ASI290MC on 150/750, 180 s gain 0 offset 1, 28 C.
# Shot as "IC 462" (Ekos frames light/IC_462_Light_001-010), but IC 462 is a star (NED type *, 1' from the
# pointing); the field is the NGC 2340 galaxy group (z ~ 0.02, ~280 million ly). Folder renamed ic462 -> ngc2340 on
# 31 Oct; the frame names were kept.
# 10 lights at 29 deg altitude in evening twilight. Darks: 5 x 180 s, same settings, 27.6 C, same night.
# (master_dark.fits in the folder is a debayered one from an earlier Siril try: not usable as a master.)
# No flats: background from the vignetting model (BG=radial) plus the residual stage, with every group galaxy masked.
TITLE="Група галактик NGC 2340 у Рисі"
ABOUT="Еліптична галактика NGC 2340 разом з NGC 2334 та IC 458, 459, 460, 461 і 464 — невелика група на відстані близько 280 мільйонів світлових років (червоний зсув 0,02). IC 463 — фонова галактика, удвічі далі. Знято низько над обрієм у вечірніх сутінках."
NAME=ngc2340
D=/media/vsulym/Transcend/Astrophoto/deepsky/2026/ngc2340
LIGHTS=$D/light
DARKS=$D/dark
WORK=$D/work

# NGC 2340, elliptical (position NED, size and PA HyperLEDA)
RA=07:11:10.8
DEC=+50:10:29
MAJOR=3.2
MINOR=1.6
PA=71
# the rest of the group, same sources (IC 460 has no catalogue size: 0.6' x 0.5' assumed). IC 463 is a background
# galaxy (z = 0.039). NGC 2334 S0, IC 458 E-S0, IC 464 E.
GALAXIES_EXTRA="07:11:33.6,+50:14:54,1.2,0.9,70 07:10:34.2,+50:07:09,0.9,0.4,173 07:10:38.7,+50:10:38,0.6,0.5,1
                07:10:44.3,+50:12:09,0.6,0.5,0 07:10:45.0,+50:04:53,0.6,0.5,36 07:11:00.9,+50:07:04,0.5,0.5,95
                07:11:04.7,+50:08:12,0.8,0.4,60"

KEEP_BEST=100%                # only 10 frames
SOLVE=offline                 # VizieR timing out on 31 Oct
BG=radial
BG_RESIDUAL=160
STRETCH_OPTS="--lumsmooth=0 --black=4 --sky=0.13 --bg=flat --skydn=0.5 --skychroma=1.5 --chroma=1.5 --skyflat=0.15"
