# 8 lights; pointing drifts ~3' in Dec across the sequence (no dithering).
# Darks: 15 x 180 s gain 0 offset 0 at 26 C, taken the same night (saved as NGC_2165). Offset 1 vs 0 is ~10 ADU: harmless.
# No flats: background modelled on a grid in the stretch (--bg=grid).
NAME=ngc1569
D=/media/vsulym/Transcend/Astrophoto/deepsky/2026/ngc1569
LIGHTS=$D/light
DARKS=$D/dark
WORK=$D/work

# dwarf irregular galaxy (NED / RC3)
RA=04:30:49.1
DEC=+64:50:53
MAJOR=3.6
MINOR=1.8
PA=120

KEEP_BEST=100%
STRETCH_OPTS="--lumsmooth=0 --black=4 --sky=0.13 --bg=grid --skydn=1.0 --skychroma=3 --skyflat=0.15"
# a star ~1.3' SE of the centre, on the galaxy's long axis, got a dark ring: shorter deconvolution zone
DECONV=1
DECONV_MAJOR=2.4
